name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: 品質ゲート（書式 / lint / 型 / テスト）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile

      - name: 書式チェック（Prettier）
        run: pnpm format:check

      - name: リント（ESLint）
        run: pnpm lint

      - name: 型チェック（TypeScript）
        run: pnpm exec tsc --noEmit

      - name: ユニットテスト（Vitest）
        run: pnpm test
